---
applications:
  - name: fs2-cc-automation-app
    memory: 512M
    disk_quota: 1536M
    instances: 1
    buildpacks:
      - nodejs_buildpack
    path: deploy
    command: npm start
    env:
      SAP_INTEGRATION_MODE: real
      SAP_DESTINATION_NAME: SHD200SYSTEM
      SAP_ATC_CHECK_VARIANT: ZNUS_SCI_CC_CENTRAL
      NODE_ENV: production
    services:
      - fs2-cc-automation-destination
      - fs2-cc-automation-connectivity
      - zepcappg-postgres
